services:
  tracker:
    build: .
    container_name: streaming-tracker
    ports:
      - "8000:8000"
    volumes:
      - ${TRACKER_DATA_DIR:-./data}:/app/data
      # 前端静态文件挂载：宿主机编辑静态资源无需重建镜像（优化迭代期用）
      - ./static:/app/static:ro
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - NETFLIX_WATCH_REGIONS=${NETFLIX_WATCH_REGIONS:-}
      - DISNEY_WATCH_REGIONS=${DISNEY_WATCH_REGIONS:-}
      - MAX_WATCH_REGIONS=${MAX_WATCH_REGIONS:-}
      - AMAZON_WATCH_REGIONS=${AMAZON_WATCH_REGIONS:-}
      - APPLE_WATCH_REGIONS=${APPLE_WATCH_REGIONS:-}
      - HULU_WATCH_REGIONS=${HULU_WATCH_REGIONS:-}
      - DISCOVER_ALL_PROVIDERS=${DISCOVER_ALL_PROVIDERS:-true}
      - ALL_PROVIDER_WATCH_REGIONS=${ALL_PROVIDER_WATCH_REGIONS:-}
      - WATCH_MONETIZATION_TYPES=${WATCH_MONETIZATION_TYPES:-flatrate}
      - HTTP_RETRIES=${HTTP_RETRIES:-3}
      - DETAIL_REFRESH_DAYS=${DETAIL_REFRESH_DAYS:-7}
      - PENDING_RETRY_DAYS=${PENDING_RETRY_DAYS:-1,3,7,14,30}
      - PROVIDER_STALE_DAYS=${PROVIDER_STALE_DAYS:-45}
      - MIN_IMDB_RATING=${MIN_IMDB_RATING:-7.0}
      - MIN_IMDB_VOTES=${MIN_IMDB_VOTES:-1000}
      - MIN_IMDB_VOTES_GRACE=${MIN_IMDB_VOTES_GRACE:-20}
      - RATING_PRIOR_VOTES=${RATING_PRIOR_VOTES:-3000}
      - RATING_PRIOR_MEAN=${RATING_PRIOR_MEAN:-7.5}
      - TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER:-google}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - ASIAN_MIN_IMDB_VOTES=${ASIAN_MIN_IMDB_VOTES:-100}
      - ASIAN_ORIGIN_COUNTRIES=${ASIAN_ORIGIN_COUNTRIES:-CN,TW,HK,KR,JP,TH,VN}
      - OMDB_MIN_VOTES=${OMDB_MIN_VOTES:-100}
      - NEW_TITLE_GRACE_DAYS=${NEW_TITLE_GRACE_DAYS:-30}
      - DISCOVER_MIN_VOTE_COUNT=${DISCOVER_MIN_VOTE_COUNT:-100}
      - ENRICH_BATCH_SIZE=${ENRICH_BATCH_SIZE:-200}
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - SYNC_HOUR=${SYNC_HOUR:-6}
      - SYNC_MINUTE=${SYNC_MINUTE:-0}
      - SYNC_TIMEZONE=${SYNC_TIMEZONE:-Asia/Shanghai}
      - SYNC_DAYS_BACK=${SYNC_DAYS_BACK:-30}
      - SYNC_MAX_PAGES=${SYNC_MAX_PAGES:-5}
      - SYNC_WINDOW_DAYS=${SYNC_WINDOW_DAYS:-0}
      - SYNC_INCREMENTAL_OVERLAP_DAYS=${SYNC_INCREMENTAL_OVERLAP_DAYS:-3}
      - SYNC_CATALOG_SCAN_ENABLED=${SYNC_CATALOG_SCAN_ENABLED:-true}
      - SYNC_CATALOG_SCAN_DAYS_BACK=${SYNC_CATALOG_SCAN_DAYS_BACK:-365}
      - SYNC_CATALOG_WINDOW_DAYS=${SYNC_CATALOG_WINDOW_DAYS:-365}
      - SYNC_BOOTSTRAP_ON_EMPTY=${SYNC_BOOTSTRAP_ON_EMPTY:-false}
      - SYNC_BOOTSTRAP_DAYS_BACK=${SYNC_BOOTSTRAP_DAYS_BACK:-365}
      - SYNC_BOOTSTRAP_MAX_PAGES=${SYNC_BOOTSTRAP_MAX_PAGES:-10}
      # 发布版本可见性：部署时传入 build 号，/ready 与 /api/stats 会显示
      - APP_VERSION=${APP_VERSION:-}
      - BUILD_ID=${BUILD_ID:-}
    restart: unless-stopped
    # 弱 ARM 软路由限额：防止异常分支抢光 2GB 内存（无 swap）
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
